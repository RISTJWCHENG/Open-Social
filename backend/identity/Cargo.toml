[package]
name = "open_social_identity"
version = "0.1.0"
edition = "2021"
description = "OpenSocial identity canister: one account, several sign-in methods, canister-signed delegations."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
open_social_inbox_core = { path = "../inbox_core" }
candid = "0.10.39"
ic-cdk = "0.20.3"
ic-canister-sig-creation = "1.3.1"
ic-certification = "3.2"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
ciborium = "0.2.2"
ic-management-canister-types = "0.11.0"
ic-stable-structures = "0.7.2"

[dev-dependencies]
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
