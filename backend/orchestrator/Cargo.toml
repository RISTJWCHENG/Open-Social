[package]
name = "open_social_orchestrator"
version = "0.1.0"
edition = "2021"
description = "OpenSocial orchestrator: assigns new accounts to inbox shards, creates and upgrades shards, tops up their cycles and hands out send-ticket keys."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
open_social_inbox_core = { path = "../inbox_core" }
candid = "0.10.39"
ic-cdk = "0.20.3"
ic-cdk-timers = "1"
ic-management-canister-types = "0.11.0"
ic-stable-structures = "0.7.2"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11.19"
sha2 = "0.10"
hex = "0.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
