[package]
name = "open_social_profiles"
version = "0.1.0"
edition = "2021"
description = "OpenSocial profiles canister: avatars and profile data in stable memory."
license = "LicenseRef-Proprietary"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
candid = "0.10.39"
ic-cdk = "0.20.3"
ic-stable-structures = "0.7.2"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11.19"
sha2 = "0.10"
hex = "0.4"
unicode-normalization = "0.1"
unicode-script = "0.5"

[profile.release]
lto = true
codegen-units = 1
strip = true
